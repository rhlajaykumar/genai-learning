[project]
name = "ai"
version = "0.1.0"
description = "AI microservice (FastAPI + Google ADK)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-adk>=1.0.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "httpx>=0.28.1",
    "pypdf>=6.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
